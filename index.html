<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="image/Screenshot From 2026-11-23 10-49-31.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <body class="bg-light mt-5">

        <div class="container mt-5">

            <div class="card mx-auto shadow p-3 bg-black" style="max-width: 350px;">

                <h3 class="text-center mb-3 text-white">Calculator</h3>

                <input type="text" id="input" class="form-control mb-3 text-end" >

                <div class="row g-2">

                    <div class="col-3">
                        <button onclick="clea()" class="btn btn-danger w-100">AC</button>
                    </div>

                    <div class="col-3">
                        <button onclick="dele()" type="button" class="btn btn-secondary w-100">DEL</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('%')" class="btn btn-secondary w-100">%</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('/')"  class="btn btn-warning w-100">/</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('7')" class="btn btn-light border w-100">7</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('8')" class="btn btn-light border w-100">8</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('9')" class="btn btn-light border w-100">9</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('*')"  class="btn btn-warning w-100">*</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('4')" class="btn btn-light border w-100">4</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('5')" class="btn btn-light border w-100">5</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('6')" class="btn btn-light border w-100">6</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('-')"  class="btn btn-warning w-100">-</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('1')" class="btn btn-light border w-100">1</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('2')" class="btn btn-light border w-100">2</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('3')" class="btn btn-light border w-100">3</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('+')" class="btn btn-warning w-100">+</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num('0')" class="btn btn-light border w-100">0</button>
                    </div>

                    <div class="col-3">
                        <button onclick="num()" class="btn btn-light border w-100">.</button>
                    </div>

                    <div class="col-6">
                        <button onclick="equal()" class="btn btn-success w-100">=</button>
                    </div>

                </div>

            </div>

        </div>

        <script src="script.js"></script>

    </body>

</body>

</html>
